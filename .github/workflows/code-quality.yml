name: Code Quality

on:
  pull_request:
    branches: ["main"]

jobs:
  daily-summary-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run daily summary tests
        run: dotnet test src/HuaJiBot.NET.UnitTest --filter FullyQualifiedName~DailySummaryTest

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format HuaJiBot.NET.slnx --verify-no-changes
